version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'chore(deps)'
      groups:
          npm-dependencies:
              patterns: ['*']
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: 'chore(deps)'
      groups:
          github-actions:
              patterns: ['*']
